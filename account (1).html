s1h:"Apa itu Kode Verifikasi?",s1:"Kode Verifikasi adalah kode yang kamu buat di perangkat BARU (perangkat penerima), lalu diberikan kepada pemilik akun di perangkat lama. Kode inilah yang menghubungkan kedua perangkat dalam proses pindah akun, sehingga proses hanya berjalan bila kedua pihak sepakat.",

s1h:"¿Qué es un Código de Verificación?",s1:"El Código de Verificación es un código que creas en tu dispositivo NUEVO (el receptor) y que luego entregas al dueño de la cuenta en el dispositivo antiguo. Es lo que conecta ambos dispositivos durante la transferencia, de modo que el proceso solo continúa si ambas partes están de acuerdo.",
s2h:"¿Cómo funciona la transferencia?",s2:"Primero, pulsa OK en la parte inferior de esta página e introduce el código de apertura que aparece para desbloquear la creación del Código de Verificación. Segundo, crea el Código de Verificación y envíalo al dueño de la cuenta en el dispositivo antiguo. Tercero, el dueño introduce ese código y recibe un ID de Transferencia a cambio. Cuarto, pega el ID de Transferencia en el panel Recibir cuenta de tu dispositivo: la cuenta pasa a tu dispositivo.",
s3h:"Reglas importantes",s3:"Solo una regla importante: mover una cuenta es definitivo; una vez hecho, no se puede cancelar ni repetir. No hay nada que configurar ni cambiar más que seguir los pasos de esta página. Continúa solo si tú y el dueño de la cuenta están totalmente seguros.",

s3h:"重要规则",s3:"只有一条重要规则：账号转移是最终操作——一旦完成，无法取消也无法重来。除了按照本页步骤操作，无需设置或更改任何东西，也没有其他任何额外条件。只有当你和账号主人都完全确定时才继续。",
s4h:"安全须知",s4:"验证码、解锁码和转移 ID 都属于私密信息——只与本次转移相关的双方分享。只使用游戏内的官方功能，忽略任何人提供的其他方法。这些信息不需要交给任何第三方，也不应被用于任何游戏之外的用途。",
