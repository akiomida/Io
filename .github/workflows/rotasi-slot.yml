name: rotasi-slot

on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  terbit:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Siapkan Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tulis kunci privat dari Secret (tidak pernah tersimpan di repo)
        run: |
          mkdir -p keys
          printf '%s' "$SLOT_PRIV" > keys/akmd_slot_priv.jwk
        env:
          SLOT_PRIV: ${{ secrets.SLOT_PRIV }}

      - name: Terbitkan slot segar
        run: |
          rm -f site/slot/s/*.js
          node scripts/gen_slots.js --out site/slot --ttl 240 --window 2 --cap 20 --priv keys/akmd_slot_priv.jwk

      - name: Hapus kunci dari runner
        if: always()
        run: rm -f keys/akmd_slot_priv.jwk

      - name: Commit & dorong perubahan slot
        run: |
          git config user.name  "akmd-bot"
          git config user.email "akmd-bot@users.noreply.github.com"
          git add site/slot
          git commit -m "rotasi slot otomatis $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "tidak ada perubahan"
          git push
