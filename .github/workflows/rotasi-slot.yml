name: rotasi-slot

on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terbit:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Siapkan Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tulis kunci privat dari Secret (tidak pernah tersimpan di repo)
        run: |
          mkdir -p keys
          printf '%s' "$SLOT_PRIV" > keys/akmd_slot_priv.jwk
        env:
          SLOT_PRIV: ${{ secrets.SLOT_PRIV }}

      - name: Terbitkan slot segar
        run: |
          rm -f site/slot/s/*.js
          node scripts/gen_slots.js --out site/slot --ttl 240 --window 2 --cap 20 --priv keys/akmd_slot_priv.jwk

      - name: Hapus kunci dari runner
        if: always()
        run: rm -f keys/akmd_slot_priv.jwk

      - name: Deploy situs + slot ke Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
